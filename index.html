<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123b2a">
  <title>WarungKu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <strong>WarungKu</strong>
  <button id="btnCartTop">🛒 Keranjang</button>
</header>

<nav>
  <button data-tab="toko" class="active">Toko</button>
  <button data-tab="lacak">Lacak Pesanan</button>
  <button data-tab="admin">Admin</button>
</nav>

<!-- TAB TOKO -->
<main id="tab-toko">
  <h2>Yang kamu butuhkan</h2>
  <div id="catalog"></div>

  <div class="card hidden" id="cartCard">
    <h3>Keranjang</h3>
    <div id="cartItems"></div>
    <div class="row" style="margin-top:12px;">
      <strong>Subtotal</strong>
      <strong class="price" id="cartSubtotal">Rp0</strong>
    </div>
    <button class="btn" id="btnOpenCheckout" style="margin-top:10px;">Lanjut checkout</button>
  </div>
</main>

<!-- TAB LACAK -->
<main id="tab-lacak" class="hidden">
  <h2>Lacak Pesanan</h2>
  <div class="card">
    <label>Nomor pesanan</label>
    <input id="trackNum" placeholder="WK-XXXXXX">
    <label>Kode akses</label>
    <input id="trackCode" placeholder="6 karakter">
    <button class="btn" id="btnTrack" style="margin-top:10px;">Cek status</button>
  </div>
  <div id="trackResult"></div>
</main>

<!-- TAB ADMIN -->
<main id="tab-admin" class="hidden">
  <div id="adminLogin" class="card">
    <h2>Login Admin</h2>
    <label>Email</label>
    <input id="loginEmail" type="email">
    <label>Kata sandi</label>
    <input id="loginPass" type="password">
    <button class="btn" id="btnLogin" style="margin-top:10px;">Masuk</button>
    <p id="loginMsg" class="muted"></p>
  </div>

  <div id="adminArea" class="hidden">
    <div class="row">
      <span>Masuk sebagai <strong id="adminWho"></strong></span>
      <button class="btn small secondary" id="btnLogout">Keluar</button>
    </div>
    <div class="card" id="adminSummary"></div>
    <div class="row" style="gap:6px;">
      <button class="btn small" id="subPesanan">Pesanan</button>
      <button class="btn small secondary" id="subProduk">Produk</button>
    </div>
    <div id="admin-pesanan"></div>
    <div id="admin-produk" class="hidden"></div>
  </div>
</main>

<!-- MODAL CHECKOUT -->
<div id="checkoutModal" class="modal hidden">
  <div class="modal-box">
    <h2>Checkout</h2>
    <label>Nama</label>
    <input id="cName">
    <label>Nomor telepon</label>
    <input id="cPhone" type="tel">
    <label>Cara terima</label>
    <select id="cFulfill">
      <option value="pickup">Ambil sendiri</option>
      <option value="delivery">Diantar</option>
    </select>
    <div id="addrWrap" class="hidden">
      <label>Alamat pengiriman</label>
      <textarea id="cAddress"></textarea>
    </div>
    <label>Catatan</label>
    <textarea id="cNotes"></textarea>
    <div class="row" style="margin-top:12px;gap:6px;">
      <button class="btn secondary" id="btnCloseCheckout">Batal</button>
      <button class="btn" id="btnSubmitOrder">Pesan</button>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
<script>
  document.getElementById("btnCartTop").onclick = () =>
    document.getElementById("cartCard").scrollIntoView({ behavior: "smooth" });
</script>

</body>
</html>
